# App only. Postgres is the shared server (database finper), same host and user
# as Chinese Laoshi. Do not add a postgres service here.
# Production images are deployed by Coolify from GHCR (.github/workflows/deploy.yml).
# Set DATABASE_URL in Coolify: postgres://USER@HOST:5432/finper

services:
  api:
    image: ${REGISTRY_IMAGE:-ghcr.io/slavoyar/finper-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to postgres://USER@HOST:5432/finper}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TINKOFF_TOKEN: ${TINKOFF_TOKEN:-}

  ui:
    image: ${UI_IMAGE:-ghcr.io/slavoyar/finper-ui:latest}
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: always
    ports:
      - "${UI_PORT:-8080}:80"
