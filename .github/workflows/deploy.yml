# Production: push to main builds GHCR images, then Coolify deploys them.
# DATABASE_URL (database finper on the shared Postgres) is set in Coolify, not here.

name: Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate --workspace=@finper/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finper

      - run: npm run build --workspace=@finper/api

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/finper-api:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/finper-api:sha-${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/finper-ui:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/finper-ui:sha-${{ github.sha }}

      - name: Trigger Coolify deploy
        run: >
          curl --fail --silent --show-error
          --request POST "${{ secrets.COOLIFY_WEBHOOK }}"
          --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
